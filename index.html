<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | DNA Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="custom-cursor"></div>
    <canvas id="webgl-canvas"></canvas>
    
    <div id="ui-layer">
      <!-- Scroll sections for Lenis and GSAP ScrollTrigger to track -->
      <div id="scroll-container">
        <section id="about" class="panel">
          <div class="section-content hero">
            <h1>Your Name</h1>
            <p class="tagline">Creative Technologist & Developer</p>
          </div>
        </section>
        
        <section id="skills" class="panel">
          <div class="section-content">
            <h2>Skills</h2>
            <!-- Skills info will be populated dynamically or static -->
          </div>
        </section>

        <section id="projects" class="panel">
          <div class="section-content">
            <h2>Projects</h2>
          </div>
        </section>

        <section id="experience" class="panel">
          <div class="section-content">
            <h2>Experience</h2>
          </div>
        </section>

        <section id="contact" class="panel">
          <div class="section-content">
            <h2>Contact</h2>
          </div>
        </section>
      </div>
    </div>
    
    <script type="module" src="/main.js"></script>
  </body>
</html>
